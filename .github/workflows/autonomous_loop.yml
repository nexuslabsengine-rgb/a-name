name: 100% Autonomous Halal Income Engine

on:
  schedule:
    # يعمل أوتوماتيكياً كل يوم في منتصف الليل بدون أي تدخل
    - cron: '0 0 * * *'
  workflow_dispatch: # يتيح لك الضغط على زر Run للمرة الأولى فقط للتجربة

jobs:
  run-swarm-agents:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Execute Full Autonomous Loop
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAYMENT_LINK: ${{ secrets.PAYMENT_LINK }}
        run: python engine.py
