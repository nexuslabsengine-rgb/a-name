name: Autonomous AI Money Engine

on:
  schedule:
    # يعمل تلقائياً مرتين يومياً (كل 12 ساعة)
    - cron: '0 */12 * * *'
  workflow_dispatch: # يتيح التشغيل اليدوي للتجربة في أي وقت

jobs:
  run-autonomous-agents:
    runs-runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai requests

      - name: Run AI Agent Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_API_KEY: ${{ secrets.BLOGGER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AFFILIATE_OR_STORE_LINK: ${{ secrets.AFFILIATE_OR_STORE_LINK }}
        run: python main.py
